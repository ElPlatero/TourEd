<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>TourEd – Stempelstellenkarte</title>
    <link rel="stylesheet" href="https://cdn.rawgit.com/openlayers/openlayers.github.io/master/en/v5.3.0/css/ol.css" />
    <link rel="stylesheet" href="css/toured.css" />
    <script defer src="https://cdn.rawgit.com/openlayers/openlayers.github.io/master/en/v5.3.0/build/ol.js"></script>
    <script defer src="js/toured.js"></script>
</head>
<body>
<a class="skip-link" href="#map">Zur Karte springen</a>
<main id="appShell">
    <h1 class="visually-hidden">TourEd-Stempelstellenkarte</h1>
    <div class="brand-logo" aria-hidden="true">
        <img src="img/toured-logo.svg" alt="" />
    </div>
    <header id="userSession" aria-label="Benutzersitzung">
        <button
            id="accountMenuButton"
            class="account-menu-button"
            type="button"
            aria-expanded="false"
            aria-controls="accountPanel"
            aria-label="Kontomenü öffnen">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0" />
            </svg>
            <span>Konto</span>
        </button>
        <div id="accountPanel" class="account-panel" hidden>
            <span id="sessionStatus" role="status" aria-live="polite">Sitzung wird geladen …</span>
            <a id="loginLink" class="action" href="auth/login" hidden>Mit Google anmelden</a>
            <button id="logoutButton" class="action" type="button" hidden>Abmelden</button>
        </div>
    </header>

    <p id="mapStatus" class="map-status" role="status" aria-live="polite">Karte wird geladen …</p>

    <section
        id="map"
        tabindex="0"
        aria-label="Interaktive Karte der TourEd-Stempelstellen"
        aria-describedby="mapInstructions">
    </section>
    <p id="mapInstructions" class="visually-hidden">
        Die Karte kann mit Touch, Maus oder Tastatur bewegt und vergrößert werden.
        Eine Stempelstelle auswählen, um ihre Details anzuzeigen.
    </p>

    <aside id="mapLegend" aria-label="Kartenlegende" hidden>
        <span><span class="legend-pin legend-pin--open" aria-hidden="true"></span>Offen</span>
        <span><span class="legend-pin legend-pin--visited" aria-hidden="true"><span>✓</span></span>Besucht</span>
    </aside>

    <section
        id="infoCard"
        role="dialog"
        aria-modal="false"
        aria-labelledby="pointName"
        tabindex="-1"
        hidden>
        <header class="info-card__header">
            <div>
                <p id="pointNumber" class="point-number"></p>
                <h2 id="pointName" class="point-name"></h2>
            </div>
            <button id="closeInfoButton" class="icon-button" type="button" aria-label="Details schließen">×</button>
        </header>
        <p id="pointStatus" class="point-status"></p>
        <div id="pointTours"></div>
        <time id="pointVisited" class="point-visited" hidden></time>
    </section>
</main>
</body>
</html>

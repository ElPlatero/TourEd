<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="title description">
  <title id="title">TourEd Logo</title>
  <desc id="description">Blaues rundes Signet mit Bergen, Wanderweg, Bäumen und einem Stempel mit Häkchen; daneben TourEd und der Claim Deine Wanderstempel. Alle auf einen Blick.</desc>

  <defs>
    <clipPath id="badge-clip">
      <circle cx="154" cy="154" r="116"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#279CDF"/>
      <stop offset="1" stop-color="#147FC1"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDEFF8"/>
    </linearGradient>
    <filter id="seal-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0E3657" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Kreisförmiges Wanderstempel-Signet -->
  <circle cx="154" cy="154" r="126" fill="#FFFFFF" stroke="#123E65" stroke-width="8"/>
  <circle cx="154" cy="154" r="116" fill="url(#sky)"/>
  <circle cx="154" cy="154" r="105" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".88"/>

  <g clip-path="url(#badge-clip)">
    <!-- Berge -->
    <path d="M26 177 L86 112 L116 142 L157 79 L231 169 L281 208 L26 208 Z"
          fill="#174F78"/>
    <path d="M86 112 L116 142 L103 143 L88 131 L75 145 L63 145 Z"
          fill="#EAF6FB"/>
    <path d="M157 79 L198 129 L181 124 L167 107 L155 117 L145 104 L126 134 Z"
          fill="#FFFFFF"/>
    <path d="M22 194 C63 171 101 168 137 179 C181 192 223 183 286 156 L286 286 L22 286 Z"
          fill="#0E5C83"/>

    <!-- Geschwungener Wanderweg -->
    <path d="M141 292 C132 257 138 231 169 210 C188 197 191 185 176 173 C165 165 158 157 162 145"
          fill="none" stroke="url(#path)" stroke-width="20" stroke-linecap="round"/>
    <path d="M141 292 C132 257 138 231 169 210 C188 197 191 185 176 173 C165 165 158 157 162 145"
          fill="none" stroke="#93CCE9" stroke-width="2.5" stroke-linecap="round" opacity=".75"/>

    <!-- Nadelbäume -->
    <g fill="#0A3D5D">
      <path d="M60 209 L79 167 L72 167 L87 137 L102 167 L95 167 L114 209 Z"/>
      <rect x="84" y="202" width="6" height="24" rx="2"/>
      <path d="M211 215 L226 180 L220 180 L233 154 L246 180 L240 180 L255 215 Z"/>
      <rect x="230" y="210" width="6" height="20" rx="2"/>
      <path d="M31 225 L44 196 L39 196 L50 173 L61 196 L56 196 L69 225 Z" opacity=".9"/>
      <rect x="48" y="220" width="5" height="17" rx="2"/>
    </g>
  </g>

  <!-- Stilisierter Handstempel: Griff und Stempelfuß -->
  <g stroke="#123E65" stroke-width="6" stroke-linejoin="round">
    <path d="M218 188 L220 178 Q221 169 229 163 L229 153
             Q229 143 237 143 Q245 143 245 153 L245 163
             Q253 169 254 178 L256 188 Z"
          fill="#FFFFFF"/>
    <path d="M210 187 Q210 181 216 181 H258 Q264 181 264 187
             V199 H210 Z"
          fill="#168BD2"/>
  </g>

  <!-- Runder Stempelabdruck mit Checkmark -->
  <g filter="url(#seal-shadow)">
    <circle cx="237" cy="225" r="47" fill="#FFFFFF" stroke="#123E65" stroke-width="7"/>
    <circle cx="237" cy="225" r="36" fill="#168BD2"/>
    <path d="M218 225 L231 238 L257 210"
          fill="none" stroke="#FFFFFF" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wortmarke -->
  <text x="330" y="172" textLength="610" lengthAdjust="spacingAndGlyphs"
        font-family="Inter, Avenir Next, Avenir, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="138" font-weight="750" letter-spacing="-4">
    <tspan fill="#123E65">Tour</tspan><tspan fill="#168BD2">Ed</tspan>
  </text>

  <!-- Claim -->
  <text x="330" y="235" textLength="610" lengthAdjust="spacingAndGlyphs"
        fill="#6B8499"
        font-family="Inter, Avenir Next, Avenir, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="31" font-weight="500" letter-spacing=".25">Deine Wanderstempel. Alle auf einen Blick.</text>
</svg>
